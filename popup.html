<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 460px; max-height: 600px;
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #14161a; color: #e8eaed; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid #262a31;
    background: linear-gradient(135deg, #1b2a4a, #16202f);
  }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .sub { font-size: 11px; color: #8b95a5; margin-top: 2px; }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .switch input { width: 16px; height: 16px; accent-color: #4c8dff; }

  .tabs { display: flex; border-bottom: 1px solid #262a31; }
  .tab {
    flex: 1; padding: 9px 0; text-align: center; cursor: pointer;
    font-size: 12px; color: #8b95a5; border-bottom: 2px solid transparent;
    user-select: none;
  }
  .tab.active { color: #6ea8ff; border-bottom-color: #4c8dff; }

  .panel { display: none; padding: 10px 12px; overflow-y: auto; max-height: 470px; }
  .panel.active { display: block; }

  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  input[type=text], input[type=number] {
    flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #2e343d;
    background: #1b1f26; color: #e8eaed; font-size: 12px; outline: none; min-width: 0;
  }
  input:focus { border-color: #4c8dff; }
  button {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4250;
    background: #232a35; color: #d7dde7; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #2c3542; border-color: #4c8dff; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2f6ae0; border-color: #2f6ae0; color: #fff; }
  button.primary:hover:not(:disabled) { background: #3d7bf0; }

  /* 自绘下拉 */
  .dd { position: relative; flex: 1; }
  .dd-btn {
    width: 100%; text-align: left; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #2e343d; background: #1b1f26; color: #e8eaed;
    font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .dd-btn:hover { border-color: #4c8dff; }
  .dd-btn .arrow { color: #7d8798; font-size: 10px; }
  .dd-list {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: #1b1f26; border: 1px solid #3a4250; border-radius: 6px;
    max-height: 230px; overflow-y: auto; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .dd-list.open { display: block; }
  .dd-item { padding: 7px 10px; cursor: pointer; font-size: 12px; color: #cfd6e2; }
  .dd-item:hover { background: #263041; }
  .dd-item.sel { color: #6ea8ff; background: #1e2a3d; }

  .course {
    padding: 8px 10px; border-radius: 8px; background: #1b1f26;
    border: 1px solid #262c35; margin-bottom: 7px; cursor: pointer;
  }
  .course:hover { border-color: #3f6bb5; }
  .course .name { font-size: 12.5px; font-weight: 600; color: #dfe6f0; }
  .course .meta { font-size: 11px; color: #7d8798; margin-top: 3px; }
  .course .acts { margin-top: 6px; display: flex; gap: 6px; }
  .course .acts button { padding: 4px 9px; font-size: 11px; }
  .tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: #24344f; color: #7fa8e8; margin-left: 6px; font-weight: 400;
  }
  .tag.year { background: #2d3f2a; color: #8fd18a; }
  .tag.hidden { background: #4a3a22; color: #e0b46a; }
  .hint { font-size: 11px; color: #6b7482; padding: 4px 2px; }

  /* 扫描面板 */
  .scan-box { background: #1b1f26; border: 1px solid #262c35; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .scan-title { font-size: 12px; color: #cfd6e2; font-weight: 600; margin-bottom: 8px; }
  .progress { height: 6px; background: #262c35; border-radius: 3px; overflow: hidden; margin: 8px 0 6px; }
  .progress .bar { height: 100%; width: 0; background: linear-gradient(90deg, #2f6ae0, #6ea8ff); transition: width .2s; }
  .scan-stat { font-size: 11px; color: #8b95a5; display: flex; justify-content: space-between; }
  .scan-stat b { color: #6ea8ff; font-weight: 600; }
  .radar {
    font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    color: #4d8f4d; background: #0d1a0d; border-radius: 6px; padding: 6px 8px;
    height: 68px; overflow: hidden; white-space: pre; line-height: 1.25;
  }

  .session {
    padding: 7px 10px; border-left: 2px solid #2f6ae0;
    background: #191d24; margin-bottom: 5px; border-radius: 0 6px 6px 0;
  }
  .session .t { font-size: 12px; color: #cfd6e2; }
  .session .m { font-size: 11px; color: #78828f; margin-top: 2px; }
  .session .acts { margin-top: 5px; display: flex; gap: 6px; }

  #status { font-size: 11px; padding: 6px 12px; color: #7d8798; border-top: 1px solid #262a31; }
  .err { color: #ff7b72; }
  .ok { color: #78c878; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>yanhekttool</h1>
      <div class="sub">课程扫描 · 节次目录 · 原站播放</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked />
      <span>启用</span>
    </label>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="all">课程搜索</div>
    <div class="tab" data-tab="scan">年份扫描</div>
    <div class="tab" data-tab="sessions">节次列表</div>
  </div>

  <!-- 课程搜索 -->
  <div class="panel active" id="panel-all">
    <div class="row">
      <input type="text" id="kw" placeholder="课程名 / 课程号 / 教师" />
      <button class="primary" id="btn-search">搜索</button>
    </div>
    <div class="row">
      <div class="dd" id="dd-sem">
        <button class="dd-btn" id="dd-sem-btn">
          <span id="dd-sem-label">全部学期</span><span class="arrow">▾</span>
        </button>
        <div class="dd-list" id="dd-sem-list"></div>
      </div>
    </div>
    <div class="row">
      <button id="btn-prev">上一页</button>
      <button id="btn-next">下一页</button>
      <span class="hint" id="pageInfo"></span>
    </div>
    <div class="row" style="margin-bottom:6px">
      <span class="hint" id="cacheHint" style="flex:1"></span>
      <button id="btn-clear-cache" style="padding:3px 8px;font-size:11px">清空缓存</button>
    </div>
    <div id="courses"></div>
  </div>

  <!-- 年份扫描 -->
  <div class="panel" id="panel-scan">
    <div class="scan-box">
      <div class="scan-title">📡 搜台扫描</div>
      <div class="row" style="margin-bottom:6px">
        <div class="dd" id="dd-scan-year">
          <button class="dd-btn" id="dd-scan-year-btn">
            <span id="dd-scan-year-label">选学年</span><span class="arrow">▾</span>
          </button>
          <div class="dd-list" id="dd-scan-year-list"></div>
        </div>
        <button class="primary" id="btn-scan">开始扫描</button>
        <button id="btn-scan-stop" disabled>停止</button>
      </div>
      <div class="progress"><div class="bar" id="scan-bar"></div></div>
      <div class="scan-stat">
        <span>已扫描 <b id="scan-done">0</b> 个 ID</span>
        <span>命中 <b id="scan-hit">0</b></span>
        <span>目录存在不代表录像可播放</span>
      </div>
      <div class="radar" id="radar">等待扫描…</div>
    </div>
    <div id="scan-result"></div>
  </div>

  <!-- 节次 -->
  <div class="panel" id="panel-sessions">
    <div class="hint" id="sessTitle">从课程列表点「节次」载入</div>
    <div id="sessions"></div>
  </div>

  <div id="status">就绪</div>
  <script src="popup.js"></script>
</body>
</html>
